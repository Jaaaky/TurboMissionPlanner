name: Release Build (fork)
on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**.md"
      - "**.txt"
      - "**/Translations/**"
      - "MainV2.*.resx"
      - "GCSViews/**/*.*.resx"
  push:
    tags:
      - "turbo-v*"

# Opt into the Node24 JS-action runtime now (GitHub forces it default 2026-06-02).
# Silences the Node20-deprecation warnings on checkout/cache/upload-artifact/gh-release.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/packages.config', '**/MissionPlanner.csproj') }}
          restore-keys: nuget-

      - name: Cache build obj/
        uses: actions/cache@v4
        with:
          path: |
            **/obj
          key: obj-${{ hashFiles('**/MissionPlanner.csproj') }}-${{ github.sha }}
          restore-keys: obj-

      - name: Build Release
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\Current\Bin\amd64\MSBuild.exe' | Select-Object -First 1
          $env:PATH = (Split-Path $msbuild) + ';' + $env:PATH
          msbuild -v:m -restore -t:Build -p:Configuration=Release -m MissionPlanner.sln

      - name: Debloat output (~430 MB -> ~114 MB)
        shell: pwsh
        run: .\debloat.ps1 -OutDir bin\Release\net472

      # Fork: fail the build if debloat removed something the app needs at
      # runtime (it once shipped without lib\ and could have dropped Skia).
      - name: Check release artifacts
        shell: pwsh
        run: |
          $out = "bin\Release\net472"
          $fail = @()
          function Get-PeMachine($path) {
            $b = [IO.File]::ReadAllBytes($path)
            $pe = [BitConverter]::ToInt32($b, 0x3C)
            return [BitConverter]::ToUInt16($b, $pe + 4)
          }
          $skia = Join-Path $out 'x64\libSkiaSharp.dll'
          if (-not (Test-Path $skia)) { $fail += "missing $skia" }
          elseif ((Get-PeMachine $skia) -ne 0x8664) { $fail += "$skia is not an x64 (PE32+) image" }
          $skiaArm = Join-Path $out 'arm64\libSkiaSharp.dll'
          if (-not (Test-Path $skiaArm)) { $fail += "missing $skiaArm" }
          elseif ((Get-PeMachine $skiaArm) -ne 0xAA64) { $fail += "$skiaArm is not an ARM64 image" }
          if (-not (Test-Path (Join-Path $out 'lib\os.py'))) { $fail += "missing lib\os.py (IronPython stdlib)" }
          if (-not (Test-Path (Join-Path $out 'MissionPlanner.exe'))) { $fail += "missing MissionPlanner.exe" }
          foreach ($t in 'Arabic','SC','TC','JP','KR') {
            foreach ($w in 'Regular','Bold') {
              if (-not (Test-Path (Join-Path $out "Fonts\TurboSans$t-$w.ttf"))) { $fail += "missing Fonts\TurboSans$t-$w.ttf" }
            }
          }
          if (-not (Test-Path (Join-Path $out 'Fonts\LICENSE.txt'))) { $fail += "missing Fonts\LICENSE.txt (font license)" }
          if ($fail.Count -gt 0) { $fail | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          Write-Host "Release artifacts OK"

      - name: Package
        shell: pwsh
        run: |
          $exe = "bin\Release\net472\MissionPlanner.exe"
          $vi = (Get-Item $exe).VersionInfo
          $upstream = "$($vi.FileMajorPart).$($vi.FileMinorPart).$($vi.FileBuildPart)"   # e.g. 1.3.83
          if ("${{ github.ref }}" -like 'refs/tags/turbo-v*') {
            $turbo = "${{ github.ref_name }}" -replace '^turbo-','Turbo-'                 # Turbo-v0.1.2
          } else {
            $turbo = "Turbo-dev"
          }
          $zip = "TurboMissionPlanner-$upstream-$turbo.zip"
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          Copy-Item run-wine.sh bin\Release\net472\   # Wine launcher (sleep inhibitor)
          Push-Location bin\Release\net472
          if (Test-Path version.txt) { Copy-Item version.txt ..\..\..\ }
          7z a "..\..\..\$zip" *
          Pop-Location
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$h  $zip" | Out-File -Encoding ascii checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            ${{ env.ZIP_NAME }}
            checksums.txt
            version.txt
          retention-days: 30

      - name: Create Release (on turbo-v* tag)
        if: startsWith(github.ref, 'refs/tags/turbo-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP_NAME }}
            checksums.txt
            version.txt
            ChangeLog.txt
          prerelease: false
          generate_release_notes: true

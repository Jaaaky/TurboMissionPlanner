name: Release Build (fork)
on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**.md"
      - "**.txt"
      - "**/Translations/**"
      - "MainV2.*.resx"
      - "GCSViews/**/*.*.resx"
  push:
    tags:
      - "fork-v*"

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/packages.config', '**/MissionPlanner.csproj') }}
          restore-keys: nuget-

      - name: Cache build obj/
        uses: actions/cache@v4
        with:
          path: |
            **/obj
          key: obj-${{ hashFiles('**/MissionPlanner.csproj') }}-${{ github.sha }}
          restore-keys: obj-

      - name: Build Release
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\Current\Bin\amd64\MSBuild.exe' | Select-Object -First 1
          $env:PATH = (Split-Path $msbuild) + ';' + $env:PATH
          msbuild -v:m -restore -t:Build -p:Configuration=Release -m MissionPlanner.sln

      - name: Debloat output (~430 MB -> ~114 MB)
        shell: pwsh
        run: .\debloat.ps1 -OutDir bin\Release\net472

      - name: Package
        shell: pwsh
        run: |
          cd bin\Release\net472
          if (Test-Path version.txt) { Copy-Item version.txt ..\..\..\ }
          7z a ..\..\..\MissionPlannerFork.zip *
          if (Test-Path .\md5sum.exe) { .\md5sum.exe . > ..\..\checksums.txt }

      - uses: actions/upload-artifact@v4
        with:
          name: MissionPlannerFork-${{ github.sha }}
          path: |
            MissionPlannerFork.zip
            checksums.txt
            version.txt
          retention-days: 30

      - name: Create Release (on fork-v* tag)
        if: startsWith(github.ref, 'refs/tags/fork-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MissionPlannerFork.zip
            checksums.txt
            version.txt
            ChangeLog.txt
          prerelease: false
          generate_release_notes: true
